# Periodic dependency check-up. Grouped weekly PRs keep noise low; CI must pass
# before anything merges. Security updates are raised as soon as advisories land.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "05:00"
      timezone: Asia/Riyadh
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
