name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (tracked files)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fail if high-risk secrets appear in tracked files
        run: |
          set -euo pipefail
          # Patterns that must never land in git. Local .env is gitignored.
          # Scan application sources only (avoid matching this workflow's pattern text).
          if git grep -nE 'sk-cp-|sk-ant-|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |OPENSSH )?PRIVATE KEY-----' -- \
            'server' 'client' 'shared' 'scripts' 'drizzle' 2>/dev/null; then
            echo "::error::Possible secret material found in tracked files"
            exit 1
          fi
          echo "Secret scan passed (heuristic)."

  verify:
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: irb_platform
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -uroot -prootpw"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Match engines / .node-version (Render production pin).
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -prootpw --silent 2>/dev/null; then
              echo "MySQL ready"; break
            fi
            sleep 2
          done

      - name: Apply migrations
        env:
          DATABASE_URL: mysql://root:rootpw@127.0.0.1:3306/irb_platform
        run: pnpm db:migrate

      - name: Typecheck
        run: pnpm check

      - name: Tests
        env:
          DATABASE_URL: mysql://root:rootpw@127.0.0.1:3306/irb_platform
          JWT_SECRET: ci-test-secret-not-for-production-use
          VITE_APP_ID: ci
          OWNER_OPEN_ID: dev-owner-001
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle-size budget
        # First-paint entry stays small; main vendor chunk includes React + UI libs.
        run: |
          ENTRY_BYTES=$(stat -c%s dist/public/assets/index-*.js | head -1)
          VENDOR_BYTES=$(stat -c%s dist/public/assets/vendor-*.js | grep -v charts | grep -v utils | head -1)
          echo "entry=${ENTRY_BYTES}b  vendor=${VENDOR_BYTES}b"
          if [ "$ENTRY_BYTES" -gt 81920 ]; then
            echo "::error::Initial entry chunk exceeded 80KB budget"
            exit 1
          fi
          if [ "$VENDOR_BYTES" -gt 1048576 ]; then
            echo "::error::vendor chunk exceeded 1MB budget"
            exit 1
          fi

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: irb_platform
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -uroot -prootpw"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Wait for MySQL & migrate
        env:
          DATABASE_URL: mysql://root:rootpw@127.0.0.1:3306/irb_platform
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -prootpw --silent 2>/dev/null && break
            sleep 2
          done
          pnpm db:migrate

      - name: Boot dev server
        env:
          DATABASE_URL: mysql://root:rootpw@127.0.0.1:3306/irb_platform
          JWT_SECRET: ci-test-secret-not-for-production-use
          VITE_APP_ID: ci
          OWNER_OPEN_ID: dev-owner-001
          # SA-17: dev-login is now opt-in. CI needs the explicit flag so
          # the e2e sweep can mint sessions via /api/dev/login.
          DEV_LOGIN_ENABLED: "1"
        run: |
          pnpm dev > /tmp/dev.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://localhost:3000/api/health >/dev/null 2>&1 && break
            sleep 2
          done

      - name: E2E sweep
        env:
          PORT: "3000"
        run: node scripts/e2e-sweep.mjs

      - name: Deep sweep
        env:
          PORT: "3000"
        run: node scripts/e2e-deep.mjs

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: /tmp/irb-e2e
          retention-days: 7
