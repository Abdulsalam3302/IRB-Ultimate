name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (tracked files)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fail if high-risk secrets appear in tracked files
        run: |
          set -euo pipefail
          # Patterns that must never land in git. Local .env is gitignored.
          # Scan application sources only (avoid matching this workflow's pattern text).
          if git grep -lE 'sk-cp-|sk-ant-|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |OPENSSH )?PRIVATE KEY-----' -- \
            'server' 'client' 'shared' 'scripts' 'drizzle' 2>/dev/null; then
            echo "::error::Possible secret material found in tracked files"
            exit 1
          fi
          echo "Secret scan passed (heuristic)."

  verify:
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # MariaDB supports CREATE INDEX / ADD COLUMN IF NOT EXISTS used for TiDB-safe migrations.
      # Stock MySQL 8 rejects that syntax (CI was failing on 0008_hot_query_indexes).
      mysql:
        image: mariadb:11
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: irb_ci_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Match engines / .node-version (Render production pin).
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for MariaDB
        run: |
          for i in {1..40}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -prootpw --silent 2>/dev/null; then
              echo "MariaDB ready"; break
            fi
            sleep 2
          done

      - name: Apply migrations
        env:
          DATABASE_URL: mysql://root:rootpw@127.0.0.1:3306/irb_ci_test
        run: pnpm db:migrate

      - name: Dependency vulnerability audit
        run: pnpm audit --audit-level=low

      - name: Typecheck
        run: pnpm check

      - name: Tests
        env:
          DATABASE_URL: mysql://root:rootpw@127.0.0.1:3306/irb_ci_test
          JWT_SECRET: ci-test-secret-not-for-production-use
          VITE_APP_ID: ci
          OWNER_OPEN_ID: dev-owner-001
        run: pnpm test

      - name: Build
        env:
          VITE_PUBLIC_SITE_URL: https://irb-saudi-arabia.vercel.app
        run: pnpm build

      - name: Bundle-size budget
        run: node scripts/check-bundle.mjs

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mariadb:11
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: irb_ci_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Wait for MariaDB & migrate
        env:
          DATABASE_URL: mysql://root:rootpw@127.0.0.1:3306/irb_ci_test
        run: |
          for i in {1..40}; do
            mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -prootpw --silent 2>/dev/null && break
            sleep 2
          done
          pnpm db:migrate

      - name: Build and boot isolated production-mode server
        env:
          DATABASE_URL: mysql://root:rootpw@127.0.0.1:3306/irb_ci_test?ssl=false
          JWT_SECRET: ci-test-secret-not-for-production-use
          VITE_APP_ID: ci
          VITE_PUBLIC_SITE_URL: https://irb-saudi-arabia.vercel.app
          PUBLIC_APP_URL: http://127.0.0.1:3000
          UPLOADS_DIR: /tmp/irb-ci-uploads
          ALLOW_LOCAL_TEST_DB: "1"
          ALLOW_LOCAL_STORAGE: "true"
          UPLOAD_SCAN_REQUIRED: "false" # Disposable loopback E2E; scanner protocol has separate tests.
        run: |
          pnpm build
          NODE_ENV=production node dist/index.js > /tmp/irb-runtime.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3000/api/ready >/dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/api/ready

      - name: HTTP and browser readiness checks
        run: node scripts/e2e-readiness.mjs

      - name: Bounded load and rate-limit checks
        run: node scripts/load-readiness.mjs

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            /tmp/irb-e2e
            /tmp/irb-runtime.log
          retention-days: 7
