name: Deploy IRB Saudi Arabia
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-irb-sa
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  verified-revision:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          CURRENT=$(gh api repos/${{ github.repository }}/commits/main --jq .sha)
          test "$CURRENT" = "$CANDIDATE" || { echo 'A newer revision exists. Waiting for its CI.'; exit 1; }
          SUCCESS=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$CANDIDATE&status=completed" --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          test "$SUCCESS" -gt 0 || { echo 'No passing CI for this revision.'; exit 1; }
          echo "sha=$CANDIDATE" >> "$GITHUB_OUTPUT"
  deploy-render:
    needs: verified-revision
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Deploy verified backend revision
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          VERIFIED_SHA: ${{ needs.verified-revision.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY" && test -n "$RENDER_SERVICE_ID"
          jq -n --arg sha "$VERIFIED_SHA" '{commitId:$sha,clearCache:"do_not_clear"}' > /tmp/render-deploy.json
          curl -fsS --max-time 60 -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" -H 'Content-Type: application/json' \
            --data-binary @/tmp/render-deploy.json > /tmp/render-receipt.json
          DEPLOY_ID=$(jq -er .id /tmp/render-receipt.json)
          for i in {1..90}; do
            curl -fsS --max-time 30 "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" > /tmp/render-status.json
            STATUS=$(jq -er .status /tmp/render-status.json)
            case "$STATUS" in
              live) jq -e --arg sha "$VERIFIED_SHA" '.commit.id == $sha' /tmp/render-status.json; exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated) echo "Backend deployment failed: $STATUS"; exit 1 ;;
            esac
            sleep 15
          done
          echo 'Backend deployment did not reach live before the deadline.'; exit 1
  deploy-vercel:
    needs: [verified-revision, deploy-render]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verified-revision.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm}
      - run: npm install -g vercel@52
      - name: Deploy verified frontend revision
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" && test -n "$VITE_PUBLIC_SITE_URL"
          vercel deploy --prod --token="$VERCEL_TOKEN" \
            --build-env "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" \
            --build-env "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" \
            --build-env "VITE_PUBLIC_SITE_URL=$VITE_PUBLIC_SITE_URL" \
            --build-env 'VITE_PUBLIC_DEMO_BANNER=1' \
            --build-env 'VITE_APP_ID=irb-sa-prod'
