name: Deploy IRB Saudi Arabia
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_unready:
        description: "Continue to the frontend even if the backend reports its database unavailable (maintenance deploys)"
        type: boolean
        default: false
concurrency:
  group: deploy-irb-sa
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  verified-revision:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          CURRENT=$(gh api repos/${{ github.repository }}/commits/main --jq .sha)
          test "$CURRENT" = "$CANDIDATE" || { echo 'A newer revision exists. Waiting for its CI.'; exit 1; }
          SUCCESS=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$CANDIDATE&status=completed" --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          test "$SUCCESS" -gt 0 || { echo 'No passing CI for this revision.'; exit 1; }
          echo "sha=$CANDIDATE" >> "$GITHUB_OUTPUT"
  deploy-render:
    needs: verified-revision
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Deploy verified backend revision
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          VERIFIED_SHA: ${{ needs.verified-revision.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY" && test -n "$RENDER_SERVICE_ID"
          # Keep the existing IDs so a same-commit configuration redeploy cannot
          # be mistaken for an older live instance while its new build is pending.
          curl -fsS --max-time 30 "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=20" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" > /tmp/render-before.json || {
              echo '::error title=Render deployment lookup failed::Cannot inspect existing deployments. Verify RENDER_API_KEY and service access.'; exit 1;
            }
          PREVIOUS_IDS=$(jq -ce '[.[].deploy.id]' /tmp/render-before.json)
          REQUEST_STARTED_AT=$(date +%s)
          jq -n --arg sha "$VERIFIED_SHA" '{commitId:$sha,clearCache:"do_not_clear"}' > /tmp/render-deploy.json
          CODE=$(curl -sS --max-time 60 -o /tmp/render-receipt.json -w '%{http_code}' -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" -H 'Content-Type: application/json' \
            --data-binary @/tmp/render-deploy.json) || CODE=000
          case "$CODE" in
            2??) ;;
            401|403) echo "::error title=Render API key rejected::The RENDER_API_KEY secret was rejected (HTTP $CODE). Create a new key in Render → Account Settings → API Keys, then run: gh secret set RENDER_API_KEY -R ${{ github.repository }}"; exit 1 ;;
            *) echo "::error title=Render deploy request failed::HTTP $CODE"; head -c 500 /tmp/render-receipt.json; exit 1 ;;
          esac
          REQUEST_DEPLOY_ID=$(jq -r '.id // .deploy.id // empty' /tmp/render-receipt.json 2>/dev/null || true)
          # Follow the returned deploy ID. A queued 202 may have no body; in that
          # case follow only a new deployment of this revision created after the
          # request began, excluding every deployment seen before the request.
          find_deploy() {
            curl -fsS --max-time 30 "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=20" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
            | jq -r --arg sha "$VERIFIED_SHA" --arg requested_id "$REQUEST_DEPLOY_ID" \
                --argjson previous_ids "$PREVIOUS_IDS" --argjson started_at "$REQUEST_STARTED_AT" '
                [.[].deploy | select(.commit.id == $sha)
                  | select(if $requested_id != "" then .id == $requested_id
                    else .id as $id | ($previous_ids | index($id)) == null
                      and ((.createdAt | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) >= $started_at)
                    end)] as $d
                | if ($d | length) == 0 then "- pending"
                  else ($d | sort_by(.createdAt) | last | "\(.id) \(.status)") end'
          }
          DEPLOY_ID=""; STATUS=""
          for i in {1..90}; do
            read -r DEPLOY_ID STATUS < <(find_deploy || true) || true
            case "$STATUS" in
              live) echo "Backend ${VERIFIED_SHA} is live (deploy ${DEPLOY_ID})."; break ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated) echo "Backend deployment failed: $STATUS"; exit 1 ;;
            esac
            sleep 15
          done
          [ "$STATUS" = live ] || { echo 'Backend deployment did not reach live before the deadline.'; exit 1; }
      - name: Confirm backend readiness (database and schema)
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
          ALLOW_UNREADY: ${{ inputs.allow_unready || false }}
          VERIFIED_SHA: ${{ needs.verified-revision.outputs.sha }}
        run: |
          set -uo pipefail
          # Render's liveness check keeps the process up during database outages; a release is
          # only complete once /api/ready confirms the database and schema and
          # the running process reports the exact revision approved by CI.
          IDENTITY_OK=false
          READY_CODE=000
          for i in {1..20}; do
            IDENTITY_OK=false
            rm -f /tmp/health.json /tmp/ready.json
            HEALTH_CODE=$(curl -sS --max-time 30 "$RENDER_URL/api/health" -o /tmp/health.json -w '%{http_code}') || HEALTH_CODE=000
            if [ "$HEALTH_CODE" = 200 ] && jq -e --arg sha "$VERIFIED_SHA" '.ok == true and .version == $sha' /tmp/health.json >/dev/null 2>&1; then
              IDENTITY_OK=true
            fi
            # No -f: keep the 503 body so the failure message names the state.
            READY_CODE=$(curl -sS --max-time 30 "$RENDER_URL/api/ready" -o /tmp/ready.json -w '%{http_code}') || READY_CODE=000
            if [ "$IDENTITY_OK" = true ] && [ "$READY_CODE" = 200 ] && jq -e '.ok == true' /tmp/ready.json >/dev/null 2>&1; then
              echo "Backend ${VERIFIED_SHA} ready: $(cat /tmp/ready.json)"; exit 0
            fi
            sleep 15
          done
          [ "$IDENTITY_OK" = true ] || { echo '::error title=Backend revision mismatch::The running backend did not confirm the exact CI-approved revision. A maintenance override cannot bypass revision verification.'; exit 1; }
          echo "::error title=Backend not ready::The new backend is live but /api/ready did not pass: $(head -c 300 /tmp/ready.json 2>/dev/null). Check Render logs for the [migrate]/[ready] driver code."
          if [ "$ALLOW_UNREADY" = "true" ] && [ "$READY_CODE" = 503 ] && jq -e '.ok == false and .state == "database_unavailable"' /tmp/ready.json >/dev/null 2>&1; then
            echo '::warning::Continuing the verified revision in database maintenance mode because allow_unready was set.'; exit 0;
          fi
          exit 1
  deploy-vercel:
    needs: [verified-revision, deploy-render]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verified-revision.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: {node-version: 24, cache: pnpm}
      - run: npm install -g vercel@55.0.0
      - name: Check deployment credential rotation date
        env:
          VERCEL_TOKEN_EXPIRES_AT: ${{ vars.VERCEL_TOKEN_EXPIRES_AT }}
        run: |
          python3 - <<'PY'
          import datetime, os
          value = os.environ.get('VERCEL_TOKEN_EXPIRES_AT', '')
          if not value:
              raise SystemExit('Set VERCEL_TOKEN_EXPIRES_AT to the token expiration date (YYYY-MM-DD).')
          remaining = (datetime.date.fromisoformat(value) - datetime.datetime.now(datetime.timezone.utc).date()).days
          if remaining <= 0:
              raise SystemExit('The deployment token has reached its rotation date. Replace VERCEL_TOKEN before deploying.')
          if remaining <= 14:
              print(f'::warning::Rotate the Vercel deployment token within {remaining} days.')
          PY
      - name: Deploy verified frontend revision
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERIFIED_SHA: ${{ needs.verified-revision.outputs.sha }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" && test -n "$VITE_PUBLIC_SITE_URL"
          vercel deploy --prod --token="$VERCEL_TOKEN" \
            --meta "releaseSourceCommit=$VERIFIED_SHA" \
            --build-env "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" \
            --build-env "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" \
            --build-env "VITE_PUBLIC_SITE_URL=$VITE_PUBLIC_SITE_URL" \
            --build-env 'VITE_APP_ID=irb-sa-prod'
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          sleep 20
          node scripts/indexnow-submit.mjs "$PUBLIC_SITE_URL"
