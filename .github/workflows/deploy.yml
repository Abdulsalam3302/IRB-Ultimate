name: Deploy IRB Saudi Arabia

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-irb-sa
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Render auto-deploys from Git when Blueprint/service is connected.
  # Optional: fire Deploy Hook for explicit redeploys.
  deploy-render:
    name: Render (deploy hook)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK not set — Render Git auto-deploy will pick up this push."
            exit 0
          fi
          curl -sfS -X POST "$RENDER_DEPLOY_HOOK"
          echo "Render deploy hook triggered."

  deploy-vercel:
    name: Vercel (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip without Vercel token
        id: vercel_skip
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.vercel_skip.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.vercel_skip.outputs.skip != 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install Vercel CLI
        if: steps.vercel_skip.outputs.skip != 'true'
        run: npm install -g vercel@52

      - name: Sync public build env on Vercel
        if: steps.vercel_skip.outputs.skip != 'true'
        continue-on-error: true
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$VITE_SUPABASE_URL" ]; then
            printf '%s' "$VITE_SUPABASE_URL" | vercel env add VITE_SUPABASE_URL production --force --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" || true
          fi
          if [ -n "$VITE_SUPABASE_ANON_KEY" ]; then
            printf '%s' "$VITE_SUPABASE_ANON_KEY" | vercel env add VITE_SUPABASE_ANON_KEY production --force --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" || true
          fi

      - name: Deploy production
        if: steps.vercel_skip.outputs.skip != 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_SITE_URL: https://irb-saudi-arabia.vercel.app
          VITE_APP_ID: irb-sa-prod
        run: |
          vercel deploy --prod --token="$VERCEL_TOKEN" \
            --build-env "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" \
            --build-env "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" \
            --build-env "VITE_PUBLIC_SITE_URL=$VITE_PUBLIC_SITE_URL" \
            --build-env "VITE_APP_ID=$VITE_APP_ID"
