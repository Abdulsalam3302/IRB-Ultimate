name: Deploy IRB Saudi Arabia

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-irb-sa
  cancel-in-progress: true

jobs:
  deploy-railway:
    name: Railway (trigger redeploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip without Railway token
        id: railway_skip
        run: |
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "RAILWAY_TOKEN not set — Railway auto-deploys from GitHub anyway"
          fi

      - name: Trigger Railway redeploy via API
        if: steps.railway_skip.outputs.skip != 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_WEB_SERVICE_ID: ${{ vars.RAILWAY_WEB_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$RAILWAY_WEB_SERVICE_ID" ] || [ -z "$RAILWAY_ENVIRONMENT_ID" ]; then
            echo "Railway service/env vars not set — skipping API redeploy (GitHub hook still deploys)"
            exit 0
          fi
          curl -sfS -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation(\$sid: String!, \$env: String!, \$sha: String) { serviceInstanceDeployV2(serviceId: \$sid, environmentId: \$env, commitSha: \$sha) }\",\"variables\":{\"sid\":\"$RAILWAY_WEB_SERVICE_ID\",\"env\":\"$RAILWAY_ENVIRONMENT_ID\",\"sha\":\"$COMMIT_SHA\"}}"
          python3 scripts/railway-production-env.py || true

  deploy-vercel:
    name: Vercel (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip without Vercel token
        id: vercel_skip
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN not set — skipping Vercel deploy"
          fi

      - name: Install Vercel CLI
        if: steps.vercel_skip.outputs.skip != 'true'
        run: npm install -g vercel@52

      - name: Deploy production
        if: steps.vercel_skip.outputs.skip != 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --token="$VERCEL_TOKEN"
