name: Deploy IRB Saudi Arabia

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-irb-sa
  cancel-in-progress: true

jobs:
  deploy-railway:
    name: Railway (trigger redeploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip without Railway token
        id: railway_skip
        run: |
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply Railway production env
        if: steps.railway_skip.outputs.skip != 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: python3 scripts/railway-production-env.py

      - name: Trigger Railway deploy
        if: steps.railway_skip.outputs.skip != 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_WEB_SERVICE_ID: ${{ vars.RAILWAY_WEB_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          curl -sfS -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation(\$sid: String!, \$env: String!, \$sha: String) { serviceInstanceDeployV2(serviceId: \$sid, environmentId: \$env, commitSha: \$sha) }\",\"variables\":{\"sid\":\"$RAILWAY_WEB_SERVICE_ID\",\"env\":\"$RAILWAY_ENVIRONMENT_ID\",\"sha\":\"$COMMIT_SHA\"}}"

  deploy-vercel:
    name: Vercel (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip without Vercel token
        id: vercel_skip
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.vercel_skip.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.vercel_skip.outputs.skip != 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install Vercel CLI
        if: steps.vercel_skip.outputs.skip != 'true'
        run: npm install -g vercel@52

      - name: Sync Supabase env on Vercel
        if: steps.vercel_skip.outputs.skip != 'true'
        continue-on-error: true
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$VITE_SUPABASE_URL" ]; then
            printf '%s' "$VITE_SUPABASE_URL" | vercel env add VITE_SUPABASE_URL production --force --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          fi
          if [ -n "$VITE_SUPABASE_ANON_KEY" ]; then
            printf '%s' "$VITE_SUPABASE_ANON_KEY" | vercel env add VITE_SUPABASE_ANON_KEY production --force --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          fi

      - name: Deploy production
        if: steps.vercel_skip.outputs.skip != 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_SITE_URL: https://irb-saudi-arabia.vercel.app
          VITE_APP_ID: irb-sa-prod
        run: |
          vercel deploy --prod --token="$VERCEL_TOKEN" \
            --build-env "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" \
            --build-env "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" \
            --build-env "VITE_PUBLIC_SITE_URL=$VITE_PUBLIC_SITE_URL" \
            --build-env "VITE_APP_ID=$VITE_APP_ID"
