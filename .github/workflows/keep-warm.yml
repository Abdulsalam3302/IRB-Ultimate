# Readiness monitoring. A successful ping is not a capacity or restore guarantee.
name: Runtime readiness monitor
on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: irb-readiness-monitor
  cancel-in-progress: false
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify backend and public proxy readiness
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
          PUBLIC_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          test -n "$RENDER_URL" && test -n "$PUBLIC_URL"
          for url in "$RENDER_URL/api/ready" "$PUBLIC_URL/api/ready"; do
            curl -fsS --retry 2 --retry-delay 3 --max-time 60 "$url" > /tmp/irb-readiness.json
            jq -e '.ok == true and (.appVersion | type == "string")' /tmp/irb-readiness.json
          done
