name: Railway production env

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/railway-production-env.py
      - .github/workflows/railway-production-env.yml

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply production Railway variables
        if: ${{ secrets.RAILWAY_TOKEN != '' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: python3 scripts/railway-production-env.py
