name: Railway production env

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/railway-production-env.py
      - .github/workflows/railway-production-env.yml

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply production Railway variables
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN not set — skipping"
            exit 0
          fi
          python3 scripts/railway-production-env.py
