# Only a Render private service may expose this listener. No public mapping.
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /run/clamav/clamd.sock
LocalSocketMode 600
FixStaleSocket yes
TCPSocket 3310
TCPAddr 0.0.0.0
TemporaryDirectory /run/clamav/tmp

# Match application transport limits and bound archive expansion/resource use.
StreamMaxLength 15M
MaxFileSize 15M
MaxScanSize 50M
MaxScanTime 12000
MaxRecursion 8
MaxFiles 1000
MaxThreads 2
MaxQueue 8
MaxConnectionQueueLength 8
CommandReadTimeout 5
ReadTimeout 10
SendBufTimeout 500
IdleTimeout 10
ExitOnOOM yes

# A scan that skipped encrypted content or hit a limit must not look clean.
AlertExceedsMax yes
AlertEncrypted yes
AlertOLE2Macros yes
ScanArchive yes
ScanPDF yes
ScanOLE2 yes
ScanXMLDOCS yes
HeuristicAlerts yes
Bytecode yes
BytecodeSecurity TrustSigned
BytecodeUnsigned no
OfficialDatabaseOnly yes

# Keep signed updates and signature reloads enabled.
SelfCheck 60
ConcurrentDatabaseReload yes
FailIfCvdOlderThan 2

# Do not retain document contents, extracted metadata or clean-file logs.
LeaveTemporaryFiles no
GenerateMetadataJson no
LogClean no
LogVerbose no
ExtendedDetectionInfo no
LogTime yes
Debug no
